<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    </head>
    <body>
        <form id="form">
            <p style="text-align: center;">Izberi datoteko za nalaganje.<br>Datoteke na strežniku ostanejo 7 dni.</p>																																							
            <p style="text-align: center;"><input type="file" name="uploadedfile"></p>
            <p style="text-align: center;"><input type="submit" value="Naloži datoteko" name="submit"/></p>
        </form>
    </body>
    <script type="text/javascript">
            $("#form").on('submit',(function(e) {	
                e.preventDefault();
                $.ajax({
                    url: "server.php",
                    type: "POST",
                    data:  new FormData(this),
                    contentType: false,
                    processData: false,
                    success: function(data){
                    }           
                });
            }));
        
    </script>
</html>
