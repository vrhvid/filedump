<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    </head>
    <body>
        <script type="text/javascript">
            window.onload = function(){          
                $ ("#form").on('submit',(function(e) {	
                    e.preventDefault();
                    $.ajax({
                        url: "http://90.157.232.29/filedumpres/server.php",
                        type: "POST",
                        data:  new FormData(this),
                        contentType: false,
                        processData: false,
                        success: function(data){
                            location.reload();
                        }          
                    });
                }));
            }       
    </script>
    <form id="form">
        <p style="text-align: center;">Izberi datoteko za nalaganje.<br>Datoteke na strežniku ostanejo 7 dni.</p>																																							
        <p style="text-align: center;"><input type="file" name="uploadedfile"/></p>
        <p style="text-align: center;"><input type="submit" name="submit"/></p>
    </form>
